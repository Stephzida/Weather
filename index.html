<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather Site</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  </head>
  <body>
    <nav class="container-fluid nav-cover">
        <div class="container nav-container">
            <span>WEATHER APP</span>
            <button id="theme">
                <i class="bi bi-brightness-high" id="bright"></i>
                <i class="bi bi-brightness-low-fill" id="dark"></i>
            </button>
        </div>
    </nav>
    <main class="container-fluid grid-cover" >
        <div class="container grid-container">
            <div class="grid">
                <div class="item">
                    <form action="" class="form">
                        <h3>Weather Checker</h3>
                        <input type="text" placeholder="Enter City">
                        <input type="submit">
                    </form>
                </div>
                <div class="grid-two">
                    <h3>Result will be displayed here</h3>
                    <div class="item2">
                    <table>
                        <tr>
                            <th>Description</th>
                            <th>Temperature &deg;C</th>
                            <th>Pressure hPa</th>
                            <th>Humidity %</th>
                            <th>Windspeed m/s</th>
                            <th>Weather</th>
                            <th>City name</th>
                        </tr>
                    </table>
                </div>
                </div>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>
